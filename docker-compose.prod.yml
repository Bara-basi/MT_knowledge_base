name: MTSCO_knowledge_base

services:
  api:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/python:3.11-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirrors.aliyun.com}
    container_name: api
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "2",
        "--timeout-keep-alive",
        "${API_TIMEOUT_KEEP_ALIVE:-30}",
      ]
    environment:
      MINIO_ENDPOINT: ${MINIO_INTERNAL_ENDPOINT:-http://milvus-minio:9000}
      API_ROUTE_PREFIX: ${API_ROUTE_PREFIX:-/prod}
      FEISHU_ROUTE_PREFIX: ${FEISHU_ROUTE_PREFIX:-/prod}
      HARNESS_WORKDIR: /app/harness_workspace
      HARNESS_GLOBAL_CONCURRENCY: ${HARNESS_GLOBAL_CONCURRENCY:-2}
      HARNESS_CONTEXT_ARCHIVE_TOKENS: ${HARNESS_CONTEXT_ARCHIVE_TOKENS:-90000}
      FEISHU_DURABLE_QUEUE_ENABLED: "false"
      SHARED_RATE_LIMIT_ENABLED: "true"
    volumes:
      - ./data/processing:/app/harness_workspace:ro
    depends_on:
      milvus-minio:
        condition: service_healthy

  milvus-etcd:
    container_name: milvus-etcd

  milvus-minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2024-05-28T17-19-04Z}
    container_name: milvus-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_ACCESS_KEY}
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - milvus_minio:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - ai-net

  minio-init:
    depends_on:
      milvus-minio:
        condition: service_healthy

  milvus-standalone:
    container_name: milvus-standalone
    depends_on:
      milvus-minio:
        condition: service_healthy

  neo4j:
    container_name: neo4j

  postgres:
    container_name: postgres

volumes:
  milvus_minio:
