name: ${COMPOSE_PROJECT_NAME:-mtsco-kb-dev}

services:
  api:
    build:
      context: .
      args:
        INSTALL_TORCH: ${INSTALL_TORCH:-true}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${API_HOST_PORT:-18000}:8000"
    environment:
      MILVUS_COLLECTION_NAME: ${MILVUS_COLLECTION_NAME:-mtsco_knowledge_chunks_dev}
      MINIO_ENDPOINT: ${MINIO_INTERNAL_ENDPOINT:-http://host.docker.internal:9000}
      N8N_API_BASE_URL: ${DEV_N8N_API_BASE_URL:-http://host.docker.internal:5678}
      N8N_API_KEY: ${DEV_N8N_API_KEY:-}
      N8N_QUERY_WEBHOOK_URL: ${N8N_QUERY_WEBHOOK_URL:-http://host.docker.internal:5678/webhook/fastapi-test}
      N8N_QUERY_WORKFLOW_ID: ${N8N_QUERY_WORKFLOW_ID:-KZKRj0Y1QW2xTS0J}
      N8N_RETRIEVAL_WORKFLOW_ID: ${N8N_RETRIEVAL_WORKFLOW_ID:-0N11uTxPrWDr7G9O}

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    profiles:
      - local-n8n
    restart: unless-stopped
    ports:
      - "${N8N_HOST_PORT:-15678}:5678"
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      NODE_ENV: production
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${GENERIC_TIMEZONE}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_SECURE_COOKIE: "false"
      N8N_PYTHON_ENABLED: "false"
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: ${EXECUTIONS_DATA_SAVE_ON_PROGRESS:-true}
      API_BASE_URL: http://api:8000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_CHAT_TABLE: ${POSTGRES_CHAT_TABLE}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: ${MINIO_INTERNAL_ENDPOINT:-http://host.docker.internal:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY}
      MINIO_BUCKET: ${APP_MINIO_BUCKET}
      MINIO_SECURE: ${MINIO_SECURE:-false}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-files:/files
    networks:
      - ai-net
    depends_on:
      api:
        condition: service_healthy

  milvus-minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    profiles:
      - local-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_ACCESS_KEY}
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "${MINIO_HOST_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-19001}:9001"
    volumes:
      - milvus_minio:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - ai-net

  milvus-standalone:
    environment:
      MINIO_ADDRESS: ${MILVUS_MINIO_ADDRESS:-host.docker.internal:9000}
    ports:
      - "${MILVUS_HOST_PORT:-19531}:19530"
      - "${MILVUS_HEALTH_HOST_PORT:-19091}:9091"

  neo4j:
    ports:
      - "${NEO4J_HTTP_HOST_PORT:-17474}:7474"
      - "${NEO4J_BOLT_HOST_PORT:-17687}:7687"

  postgres:
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"

volumes:
  n8n_data:
  milvus_minio:
