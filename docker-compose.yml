services:
  api:
    image: ${API_IMAGE:-mtsco_knowledge_base-api}
    restart: unless-stopped
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    environment:
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${GENERIC_TIMEZONE}
      MILVUS_URI: ${MILVUS_INTERNAL_URI:-http://milvus-standalone:19530}
      MILVUS_COLLECTION_NAME: ${MILVUS_COLLECTION_NAME:-mtsco_knowledge_chunks}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_CHAT_TABLE: ${POSTGRES_CHAT_TABLE}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CHAT_MESSAGE_ENCRYPTION_KEY: ${CHAT_MESSAGE_ENCRYPTION_KEY}
      MINIO_ENDPOINT: ${MINIO_INTERNAL_ENDPOINT:-http://milvus-minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY}
      MINIO_BUCKET: ${APP_MINIO_BUCKET}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      USE_LOCAL_EMBEDDING_MODEL: ${USE_LOCAL_EMBEDDING_MODEL:-true}
      USE_LOCAL_RERANK_MODEL: ${USE_LOCAL_RERANK_MODEL:-true}
      SKIP_RETRIEVAL_WARMUP: ${SKIP_RETRIEVAL_WARMUP:-true}
      EMBEDDING_CACHE_DIR: /models
      RERANKER_CACHE_DIR: /models
      NLTK_DATA: /models/nltk_data
      JIEBA_CACHE_DIR: /models/jieba
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      N8N_QUERY_WEBHOOK_URL: ${N8N_QUERY_WEBHOOK_URL:-}
      N8N_QUERY_TIMEOUT: ${N8N_QUERY_TIMEOUT:-600}
      N8N_QUERY_CONNECT_TIMEOUT: ${N8N_QUERY_CONNECT_TIMEOUT:-10}
      N8N_API_BASE_URL: ${N8N_API_BASE_URL:-}
      N8N_API_KEY: ${N8N_API_KEY:-}
      N8N_PROGRESS_ENABLED: ${N8N_PROGRESS_ENABLED:-true}
      N8N_PROGRESS_POLL_INTERVAL: ${N8N_PROGRESS_POLL_INTERVAL:-0.5}
      N8N_PROGRESS_LOOKBACK_SECONDS: ${N8N_PROGRESS_LOOKBACK_SECONDS:-5}
      N8N_QUERY_WORKFLOW_ID: ${N8N_QUERY_WORKFLOW_ID:-KZKRj0Y1QW2xTS0J}
      N8N_RETRIEVAL_WORKFLOW_ID: ${N8N_RETRIEVAL_WORKFLOW_ID:-0N11uTxPrWDr7G9O}
      LARK_APP_ID: ${LARK_APP_ID:-}
      LARK_APP_SECRET: ${LARK_APP_SECRET:-}
      LARK_VERIFICATION_TOKEN: ${LARK_VERIFICATION_TOKEN:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_VERIFICATION_TOKEN: ${FEISHU_VERIFICATION_TOKEN:-}
      FEISHU_FEEDBACK_WINDOW_SECONDS: ${FEISHU_FEEDBACK_WINDOW_SECONDS:-1800}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      API_ROUTE_PREFIX: ${API_ROUTE_PREFIX:-}
      FEISHU_ROUTE_PREFIX: ${FEISHU_ROUTE_PREFIX:-}
      DEV_PROXY_TARGET: ${DEV_PROXY_TARGET:-}
      DEV_PROXY_TIMEOUT: ${DEV_PROXY_TIMEOUT:-600}
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ${MODEL_CACHE_DIR:-E:/models}:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ai-net
    depends_on:
      milvus-standalone:
        condition: service_healthy
      postgres:
        condition: service_healthy

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.18
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      -advertise-client-urls=http://milvus-etcd:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    volumes:
      - milvus_etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - ai-net

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:RELEASE.2024-05-24T09-08-49Z}
    profiles:
      - init
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local ${MINIO_INTERNAL_ENDPOINT:-http://milvus-minio:9000} ${MINIO_ACCESS_KEY_ID} ${MINIO_SECRET_ACCESS_KEY};
      mc mb --ignore-existing local/${APP_MINIO_BUCKET};
      "
    networks:
      - ai-net

  milvus-standalone:
    image: ${MILVUS_IMAGE:-milvusdb/milvus:v2.6.15}
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: ${MILVUS_MINIO_ADDRESS:-milvus-minio:9000}
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY}
    ports:
      - "${MILVUS_HOST_PORT:-19530}:19530"
      - "${MILVUS_HEALTH_HOST_PORT:-9091}:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      milvus-etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    networks:
      - ai-net

  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5-community}
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_HOST_PORT:-7474}:7474"
      - "${NEO4J_BOLT_HOST_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_conf:/conf
      - neo4j_plugins:/plugins
    networks:
      - ai-net

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${GENERIC_TIMEZONE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ai-net

networks:
  ai-net:
    driver: bridge

volumes:
  milvus_etcd:
  milvus_data:
  neo4j_data:
  neo4j_logs:
  neo4j_conf:
  neo4j_plugins:
  postgres_data:
