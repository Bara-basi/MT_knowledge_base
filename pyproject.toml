[project]
name = "mtsco-knowledge-base"
version = "0.1.0"
description = "Enterprise internal knowledge base backend for onboarding Q&A and future business assistants."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pymilvus[model]>=3.0.0,<4.0.0",
    "pypdf>=5.0.0,<6.0.0",
    "python-docx>=1.1.2,<2.0.0",
    "reportlab>=4.2.0,<5.0.0",
    "torch>=2.0.0,<3.0.0",
    "transformers>=4.41.0,<5.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "jieba>=0.42.1,<1.0.0",
    "nltk>=3.8.1,<4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
