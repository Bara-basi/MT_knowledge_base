[project]
name = "mtsco-knowledge-base"
version = "0.1.0"
description = "Enterprise internal knowledge base backend for onboarding Q&A and future business assistants."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pymilvus[model]>=3.0.0,<4.0.0",
    "pymilvus.model>=0.3.2,<0.4.0",
    "pypdf>=5.0.0,<6.0.0",
    "python-docx>=1.1.2,<2.0.0",
    "reportlab>=4.2.0,<5.0.0",
    "transformers>=4.41.0,<5.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "jieba>=0.42.1,<1.0.0",
    "nltk>=3.9.1,<4.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "tqdm>=4.66.0,<5.0.0",
    "minio>=7.2.0,<8.0.0",
    "oss2>=2.19.1,<3.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "cryptography>=42.0.0,<47.0.0",
    "pymupdf>=1.24.0,<2.0.0",
    "pdfplumber>=0.11.0,<1.0.0",
    "pdfminer.six>=20240706,<20270000",
    "pywin32>=306; platform_system == 'Windows'",
    "openpyxl>=3.1.0,<4.0.0",
    "xlrd>=2.0.1,<3.0.0",
    "neo4j>=5.26.0,<6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "scripts*", "tests*"]
